name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test and package tagged version
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          ./package.ps1 -Version $env:RELEASE_TAG.Substring(1) -OutputDirectory "$env:RUNNER_TEMP/Blocul17Releases"
      - name: Publish verified assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'Blocul17Releases'
          $releases = gh release list --limit 100 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases' }
          $existing = @($releases | ConvertFrom-Json) | Where-Object { $_.tagName -eq $env:RELEASE_TAG }
          if ($existing) {
            if (!$existing.isDraft) { throw 'Published releases are immutable in this workflow' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Blocul 17 $env:RELEASE_TAG" --notes-file "$out/RELEASE_NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem -LiteralPath $out -File | Where-Object { $_.Extension -in '.zip', '.sha256' } | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
          gh release edit $env:RELEASE_TAG --draft=false --latest --notes-file "$out/RELEASE_NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification
          path: qa/
          retention-days: 14
