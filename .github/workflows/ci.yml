name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile, test and verify release ZIP
        shell: powershell
        run: ./package.ps1 -OutputDirectory "$env:RUNNER_TEMP/Blocul17Checks"
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification
          path: qa/
          retention-days: 14
          if-no-files-found: warn
